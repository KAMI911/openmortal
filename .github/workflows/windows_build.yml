name: Windows Build (MSYS2 / MinGW64 / MinGW)

on:
  push:
    branches: [ master, upgrade ]
  pull_request:
    branches: [ master, upgrade ]
  workflow_dispatch:

env:
  VERSION: 0.7.26

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - PLATFORM: x86
            MSYS_TARGET: i686
            MSYSTEM: MINGW32
          - PLATFORM: x86-64
            MSYS_TARGET: x86_64
            MSYSTEM: MINGW64

    name: Build ${{ matrix.PLATFORM }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Define paths
        shell: bash
        run: |
          echo "PLATFORM_BUILD_PATH=${{ runner.temp }}/distribution/windows-${{ matrix.PLATFORM }}_build" >> $GITHUB_ENV
          echo "PLATFORM_PACKAGE_PATH=${{ runner.temp }}/distribution/windows-${{ matrix.PLATFORM }}_package" >> $GITHUB_ENV

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.MSYSTEM }}
          update: true
          install: >-
            base-devel
            automake
            autoconf
            libtool
            curl
            mingw-w64-${{ matrix.MSYS_TARGET }}-libiconv
            mingw-w64-${{ matrix.MSYS_TARGET }}-toolchain
            mingw-w64-${{ matrix.MSYS_TARGET }}-make
            mingw-w64-${{ matrix.MSYS_TARGET }}-pkg-config
            mingw-w64-${{ matrix.MSYS_TARGET }}-SDL
            mingw-w64-${{ matrix.MSYS_TARGET }}-SDL_image
            mingw-w64-${{ matrix.MSYS_TARGET }}-SDL_net
            mingw-w64-${{ matrix.MSYS_TARGET }}-freetype
            mingw-w64-${{ matrix.MSYS_TARGET }}-giflib
            mingw-w64-${{ matrix.MSYS_TARGET }}-ntldd

      # perl, icu and SDL_mixer are installed separately below: MSYS2 removed
      # them from the live i686 (32-bit) repository/database, so the x86 leg
      # has to pin exact archived package files instead of a normal pacman
      # install. x86-64 still gets them the normal way.

      - name: Install perl/icu/SDL_mixer (x86-64, from the live MSYS2 repo)
        if: matrix.PLATFORM == 'x86-64'
        shell: msys2 {0}
        run: |
          set -e
          pacman -S --noconfirm --needed \
            mingw-w64-x86_64-perl \
            mingw-w64-x86_64-icu \
            mingw-w64-x86_64-SDL_mixer

      - name: Install perl/icu/SDL_mixer (x86, pinned from the MSYS2 package archive)
        if: matrix.PLATFORM == 'x86'
        shell: msys2 {0}
        run: |
          set -e
          # mingw-w64-i686-perl, -icu and -SDL_mixer (and two of SDL_mixer's
          # own dependencies, libmikmod and libmad) were dropped from the live
          # i686 package database when MSYS2 stopped actively supporting
          # 32-bit Windows, but the actual package files are still hosted.
          # SDL_mixer's other dependencies (libvorbis, flac, libogg) are still
          # live and get resolved normally as part of this same install.
          ARCHIVE=https://repo.msys2.org/mingw/mingw32
          mkdir -p /tmp/i686-archive && cd /tmp/i686-archive
          for pkg in \
            mingw-w64-i686-perl-5.32.1-6-any.pkg.tar.zst \
            mingw-w64-i686-icu-76.1-1-any.pkg.tar.zst \
            mingw-w64-i686-libmikmod-3.3.13-1-any.pkg.tar.zst \
            mingw-w64-i686-libmad-0.15.1b-5-any.pkg.tar.zst \
            mingw-w64-i686-SDL_mixer-1.2.12-9-any.pkg.tar.zst \
          ; do
            curl -fLO --retry 3 "$ARCHIVE/$pkg"
          done
          pacman -U --noconfirm ./*.pkg.tar.zst

      - name: Configure project
        shell: msys2 {0}
        run: |
          set -e
          if [ "${{ matrix.PLATFORM }}" = "x86-64" ]; then
            PREFIX=/mingw64
            HOST=x86_64-w64-mingw32
          else
            PREFIX=/mingw32
            HOST=i686-w64-mingw32
          fi
          autoreconf -i -f
          grep -q pkg_cv_FT2 configure || { echo "::error::configure was not regenerated from configure.ac as expected"; exit 1; }
          ./configure --prefix=$PREFIX --host=$HOST

      - name: Build
        shell: msys2 {0}
        run: make -j$(nproc)

      - name: Install
        shell: msys2 {0}
        run: make DESTDIR="${PLATFORM_BUILD_PATH}" install

      - name: Package
        shell: msys2 {0}
        run: |
          set -e
          if [ "${{ matrix.PLATFORM }}" = "x86-64" ]; then
            PREFIX=/mingw64
          else
            PREFIX=/mingw32
          fi
          mkdir -p ${PLATFORM_PACKAGE_PATH}/${PREFIX}/bin
          mkdir -p ${PLATFORM_PACKAGE_PATH}/${PREFIX}/share/openmortal
          cp -a ${PLATFORM_BUILD_PATH}/${PREFIX}/share \
            ${PLATFORM_PACKAGE_PATH}/${PREFIX}/
          install -m755 \
            ${PLATFORM_BUILD_PATH}/${PREFIX}/bin/openmortal.exe \
            ${PLATFORM_PACKAGE_PATH}/${PREFIX}/bin/openmortal.exe
          ntldd -R ${PLATFORM_BUILD_PATH}/${PREFIX}/bin/openmortal.exe \
            | grep -v -i "system32" \
            | grep -i -v "winsxs" \
            | grep -v -i "not found" \
            | awk '{print $3}' \
            | xargs -d '\n' -I{} cp -- "{}" \
              ${PLATFORM_PACKAGE_PATH}/${PREFIX}/bin/
          tar zcvf openmortal-${{ env.VERSION }}_windows_${{ matrix.PLATFORM }}.tar.gz \
            -C ${PLATFORM_PACKAGE_PATH} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmortal-${{ env.VERSION }}_windows_${{ matrix.PLATFORM }}
          path: openmortal-${{ env.VERSION }}_windows_${{ matrix.PLATFORM }}.tar.gz
